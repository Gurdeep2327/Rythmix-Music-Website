<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SOUNDORA MUSIC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#fce4ec;
            font-family:Arial, sans-serif;
        }

        .contact-box{
            max-width:500px;
            margin:50px auto;
            background: white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#8b0000;
            margin-bottom:20px;
        }

        label{
            font-weight:bold;
            color:#333;
        }

        .btn-success{
            width:100%;
        }

        footer{
            text-align:center;
            background:#8b0000;
            color:white;
            padding:15px;
            margin-top:30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="contact-box">

        <h2>Contact Us</h2>

        <form>

            <div class="mb-3">
                <label>Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label>Message</label>
                <textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Send Message
            </button>

        </form>

    </div>
</div>

<footer>
    &copy; 2026 SOUNDORA MUSIC. All Rights Reserved.
</footer>

</body>
</html>
